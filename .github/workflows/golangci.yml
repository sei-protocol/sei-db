name: golangci-lint
on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the toolchain to go.mod (1.24.5)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Force all tools (including golangci-lint) to use this local toolchain
      - name: Pin toolchain
        run: echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - run: go mod download all

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --config=.golangci.yml --timeout=10m --out-format=colored-line-number
