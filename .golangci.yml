version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - goconst
    - govet
    - ineffassign
    - misspell

    - unconvert
  disable:
    - errcheck
    - gosec   # since you only had an exclusion rule
    - prealloc
    - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
