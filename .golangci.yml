# .golangci.yml — v2 format
version: "2"

run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  # v2 replaces disable-all/enable-all with `default: std|all|none`
  default: none
  enable:
    - bodyclose
    - dogsled
    - exportloopref
    - errcheck
    - goconst
    - gocritic
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - staticcheck
    # - structcheck  # (abandoned)
    - stylecheck
    - revive
    - typecheck
    - unconvert
    - unused
    - unparam
    # - nolintlint   # (conflicts with some IDEs)

issues:
  exclude-rules:
    - text: "Use of weak random number generator"
      linters: [gosec]
    - text: "ST1003:"
      linters: [stylecheck]
    # FIXME: Disabled until golangci-lint updates stylecheck with this fix:
    # https://github.com/dominikh/go-tools/issues/389
    - text: "ST1016:"
      linters: [stylecheck]

# Output configuration is optional; the action can parse default text output.
# If you want explicit control, you can uncomment below (v2 replaces --out-format with `output.*`):
# output:
#   formats:
#     text:
#       path: stdout
#       colors: true
